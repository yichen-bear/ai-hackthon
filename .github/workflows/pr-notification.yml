name: PR Notification

on:
  pull_request:
    types: [opened]
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send PR notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "New Pull Request to main: ${{ github.event.pull_request.title }}"
          to: ${{ secrets.COLLABORATOR_EMAILS }}
          from: "GitHub PR Notification <onboarding@resend.dev>"
          body: |
            A new Pull Request has been opened to the main branch.

            Title:
            ${{ github.event.pull_request.title }}

            Author:
            ${{ github.event.pull_request.user.login }}

            Pull Request URL:
            ${{ github.event.pull_request.html_url }}
